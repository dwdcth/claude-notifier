version: 2

builds:
  - main: .
    binary: claude-notifier
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -trimpath -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: ["tar.gz"]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
